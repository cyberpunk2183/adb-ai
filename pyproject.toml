[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-ai"
version = "0.1.0"
description = "Universal remote for plugging your Android devices - TVs, boxes, phones - into your AI agent, over ADB. Works with Claude, Codex, Cursor or any MCP client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["adb", "android", "android-tv", "mcp", "mcp-server", "home-automation",
            "remote-control", "ai-agent", "claude", "codex", "llm-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cyberpunk2183/adb-ai"
Issues = "https://github.com/cyberpunk2183/adb-ai/issues"

[project.scripts]
adb-ai = "adbai.cli:main"

[tool.setuptools]
packages = ["adbai"]

[tool.ruff]
line-length = 100
